packages:
  - "packages/*"

# wrangler ships prebuilt native binaries (workerd, esbuild) that unpack in a
# postinstall script. pnpm blocks build scripts by default, and without these
# two `wrangler dev` has no runtime to start.
allowBuilds:
  esbuild: true
  # miniflare pulls sharp in for local image transforms, which nothing here
  # uses; sharp 0.33 ships prebuilt binaries anyway, so its script can stay off.
  sharp: false
  workerd: true
