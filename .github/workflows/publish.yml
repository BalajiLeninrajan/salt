# Publishes salt-ai and its platform binary packages when a version tag is
# pushed. The site deploys through Cloudflare Workers Builds, not from here.
name: publish

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    # Trusted publishing: npm trades this workflow's OIDC identity for a
    # short-lived publish credential — no token, no secret. Each package names
    # this repo + workflow as its trusted publisher in its npm settings.
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # OIDC publishing needs npm >= 11.5.1; don't rely on whatever the
      # runner's Node bundles.
      - run: npm install -g npm@latest

      # Reads the pnpm version from the root package.json's packageManager.
      - uses: pnpm/action-setup@v4

      - run: pnpm install --frozen-lockfile

      - name: Check tag matches package version
        run: |
          version=$(node -p "require('./packages/cli/package.json').version")
          if [ "v$version" != "${GITHUB_REF_NAME}" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match package version v$version" >&2
            exit 1
          fi

      - name: Cross-compile and publish all packages
        run: node packages/cli/scripts/release.mjs --publish
