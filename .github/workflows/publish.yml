# Publishes saltai and its platform binary packages when a version tag is
# pushed. The site deploys through Cloudflare Workers Builds, not from here.
name: publish

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # setup-node writes the .npmrc that `npm publish` reads the token from.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Check tag matches package version
        run: |
          version=$(node -p "require('./packages/cli/package.json').version")
          if [ "v$version" != "${GITHUB_REF_NAME}" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match package version v$version" >&2
            exit 1
          fi

      - name: Cross-compile and publish all packages
        run: node packages/cli/scripts/release.mjs --publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
