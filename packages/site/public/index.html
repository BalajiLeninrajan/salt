    <title>salt — how much do you swear at your coding agents?</title>
    <meta
      name="description"
      content="salt reads the session logs Claude Code, Codex, and Cursor already keep on your machine, counts the profanity in the prompts you typed, and publishes the counts to a private link you can open and share. One command, nothing installed."

      content="How much do you swear at your coding agents? One command, nothing installed, and a link you can share."

  <body>
    <!-- Decorative: censored swears bouncing around behind the panel like the
         DVD screensaver — constant speed, reflections off the edges, elastic
         collisions with each other, colour change on every bounce. Position and
         motion live in drift.js; only the size is set here, because it is what
         determines each word's collision box. The panel is opaque, so anything
         passing behind it simply disappears. -->
    <div class="drift" aria-hidden="true">
      <span style="font-size: 40px">f*ckwit</span>
      <span style="font-size: 30px">sh*t</span>
      <span style="font-size: 34px">damn</span>
      <span style="font-size: 44px">wtf</span>
      <span style="font-size: 24px">b*llocks</span>
      <span style="font-size: 28px">c**p</span>
      <span style="font-size: 26px">ffs</span>
      <span style="font-size: 36px">hell</span>
      <span style="font-size: 22px">d*mmit</span>
      <span style="font-size: 32px">a**</span>
      <span style="font-size: 20px">bugger</span>
      <span style="font-size: 24px">f*ck</span>
    </div>

    <div class="app-shell shell page-enter" style="--page-width: 760px">
      <main class="page-main page">
        <section class="panel cn-raised-soft cn-p-32">
          <div class="mast cn-mb-32">
            <!-- Same mark as the dashboard: "salt" in Inter, with the `a`
                 replaced by a drawn arch holding a lowercase `i`. Only the arch
                 is drawn; s/l/t are real text. The numbers below are ARCH from
                 @salt/core; this page has no bundler, so they are transcribed
                 rather than imported. -->
            <span class="logo" role="img" aria-label="salt"
              >s<svg
                class="logo-a"
                viewBox="0 0 91 100"
                aria-hidden="true"
                focusable="false"
              >
                <path
                  d="M 13.5 100 L 13.5 45.5 A 32 32 0 0 1 77.5 45.5 L 77.5 100"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="27"
                />
                <circle cx="45.5" cy="44" r="8.5" fill="#b4befe" />
                <rect
                  x="37"
                  y="59"
                  width="17"
                  height="41"
                  rx="8.5"
                  fill="#b4befe"
                /></svg
              >lt</span
            >
          </div>

          <h1 class="cn-display cn-mb-16">
            How much do you <em>swear</em> at your <em>coding agents</em>?
          </h1>

          <p class="lede">
            Your agents keep a complete, timestamped record of everything you
            have ever typed at them. <code class="cn-code">salt</code> reads it
            and tells you how salty you are.
          </p>

          <div class="command is-full">
            <code class="command-text"
              ><span class="command-prompt">$</span
              ><span id="cmd">npx salt-ai</span
              ><span class="caret" aria-hidden="true"></span
            ></code>
            <!-- The recipe's copy control: a .btn.is-icon, with the label in a
                 data-tip bubble rather than a title= (which would draw the OS
                 tooltip). Both glyphs ship in the markup; copy.js toggles
                 is-copied on the .command and the recipe swaps which one
                 shows, so the success state costs no request. -->
            <button
              class="btn is-icon command-copy"
              id="copy"
              type="button"
              data-command="npx salt-ai"
              data-tip="Copy"
              aria-label="Copy the install command"
            >
              <svg
                class="copy-glyph"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
                focusable="false"
              >
                <rect x="9" y="9" width="11" height="11" rx="2.5" />
                <path d="M5 15V5.5A2.5 2.5 0 0 1 7.5 3H15" />
              </svg>
              <svg
                class="done-glyph"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2.2"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
                focusable="false"
              >
                <path d="M20 6 9 17l-5-5" />
              </svg>
            </button>
          </div>

        </section>

        <nav class="cn-row cn-end cn-gap-16 cn-mt-16 cn-px-8" aria-label="Links">
          <!-- TODO: point at the published package once v0.1.0 ships. -->
          <a class="btn-text" href="https://www.npmjs.com/package/salt-ai">npm</a>
          <a class="btn-text" href="https://github.com/BalajiLeninrajan/salt">GitHub</a>
        </nav>

        <!-- TODO: real marketing sections — a dashboard screenshot, the
             per-harness comparison, the privacy explainer. -->

      </main>

    </div>

    <script src="/copy.js"></script>
    <script src="/drift.js"></script>
  </body>
</html>
